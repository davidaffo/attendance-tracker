name: Verifica la build PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui i test
        run: npm test

      - name: Crea la build per GitHub Pages
        run: npm run build:pages

      - name: Verifica i percorsi della build
        run: npm run verify:pages

      - name: Verifica che docs sia aggiornato
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "La build versionata in docs non è aggiornata."
            git status --short -- docs
            exit 1
          fi
